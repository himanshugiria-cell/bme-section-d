<style>
:root {
  --paper: #EEF2F4;
  --surface: #FFFFFF;
  --ink: #14202A;
  --muted: #556572;
  --line: #C9D2D9;
  --accent: #145A8A;
  --accent-soft: #E2EDF5;
  --on-accent: #FFFFFF;
  --amber: #FFD15C;
  --on-amber: #3A2900;
  --danger: #B3261E;
  --ok: #1C7443;
  --pptx: #A8560B;
  --pdf: #B3261E;
  --form: #6A3FA0;
  --docx: #145A8A;
  --radius: 4px;
  --font-body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-head: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F171D; --surface: #16212A; --ink: #E7EDF1; --muted: #9AABB7; --line: #2C3B47;
    --accent: #6DB4E4; --accent-soft: #1B2E3D; --on-accent: #0B1620;
    --amber: #F2B83A; --on-amber: #2A1D00; --danger: #FF8F86; --ok: #6FD39B;
    --pptx: #F0A15A; --pdf: #FF8F86; --form: #C3A2F0; --docx: #6DB4E4;
  }
}
:root[data-theme="dark"] {
  --paper: #0F171D; --surface: #16212A; --ink: #E7EDF1; --muted: #9AABB7; --line: #2C3B47;
  --accent: #6DB4E4; --accent-soft: #1B2E3D; --on-accent: #0B1620;
  --amber: #F2B83A; --on-amber: #2A1D00; --danger: #FF8F86; --ok: #6FD39B;
  --pptx: #F0A15A; --pdf: #FF8F86; --form: #C3A2F0; --docx: #6DB4E4;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.5 var(--font-body); }
[hidden] { display: none !important; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap { max-width: 58rem; margin: 0 auto; padding: 0 1rem 3rem; }
.topbar { display: flex; justify-content: flex-end; padding: .6rem 0; }
.theme-btn { font: 400 .9rem var(--font-body); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: var(--radius); padding: .35rem .7rem; cursor: pointer; }
.theme-btn:hover { color: var(--ink); border-color: var(--ink); }

/* ---- Title block (like the corner of a drawing sheet) ---- */
.titleblock { display: grid; grid-template-columns: 1fr auto; background: var(--surface); border: 2px solid var(--ink); }
.tb-main { padding: 1.1rem 1.2rem 1.25rem; min-width: 0; }
.tb-main h1 { margin: 0 0 .45rem; font: 700 clamp(2.1rem, 7vw, 3.4rem)/1 var(--font-head); letter-spacing: .005em; }
.tb-main p { margin: 0; color: var(--muted); max-width: 34rem; }
.tb-sec { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 6rem; padding: .5rem .9rem; background: var(--ink); color: var(--paper); }
.tb-sec-label { font-size: .85rem; }
.tb-sec-letter { font: 700 clamp(4rem, 14vw, 6.5rem)/.9 var(--font-head); }
.tb-meta { grid-column: 1 / -1; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--ink); }
.tb-meta > div { padding: .6rem 1rem .7rem; min-width: 0; }
.tb-meta > div + div { border-left: 1px solid var(--line); }
.tb-meta dt { font-size: .85rem; color: var(--muted); }
.tb-meta dd { margin: 0; font-weight: 600; }
@media (max-width: 640px) {
  .tb-meta { grid-template-columns: 1fr; }
  .tb-meta > div + div { border-left: 0; border-top: 1px solid var(--line); }
}

/* ---- Search, notices, tabs ---- */
.search { margin: 1rem 0 .75rem; }
.search input { width: 100%; font: inherit; padding: .75rem .9rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
.search input::placeholder { color: var(--muted); }

.notices ul { list-style: none; margin: 0 0 1rem; padding: 0; }
.notice { display: flex; gap: .75rem; padding: .7rem .9rem; background: var(--amber); color: var(--on-amber); border-radius: var(--radius); margin-bottom: .4rem; }
.notice time { font-weight: 700; white-space: nowrap; }
.notice a { color: inherit; font-weight: 600; }

.tabs { position: sticky; top: 0; z-index: 20; display: flex; gap: .25rem; overflow-x: auto; background: var(--paper); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: .45rem; font: 600 1rem var(--font-body); padding: .8rem 1rem; background: none; color: var(--muted); border: 0; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
.count { min-width: 1.3rem; padding: .05rem .35rem; border-radius: 999px; background: var(--amber); color: var(--on-amber); font: 700 .78rem/1.3 var(--font-body); text-align: center; }

main { padding-top: 1.25rem; }
h2 { font: 700 1.5rem/1.15 var(--font-head); margin: 0 0 .6rem; }
.lede { color: var(--muted); margin: 0 0 1rem; max-width: 42rem; }

/* ---- Recently added ---- */
.recent { margin-bottom: 1.6rem; }
.recent ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); }
.recent li + li { border-top: 1px solid var(--line); }
.recent-item { display: grid; grid-template-columns: 4.2rem 1fr auto; gap: .75rem; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: .7rem .9rem; cursor: pointer; }
.recent-item:hover { background: var(--accent-soft); }
.recent-when { color: var(--muted); font-variant-numeric: tabular-nums; }
.recent-go { color: var(--accent); font-weight: 600; }

/* ---- Study material ---- */
.toolbar { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: space-between; align-items: center; margin: 0 0 .8rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button { font: 600 .95rem var(--font-body); padding: .5rem .95rem; border: 0; background: none; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.plain-btn { font: 600 .95rem var(--font-body); background: none; border: 0; color: var(--accent); cursor: pointer; padding: .5rem .3rem; }

.unit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: .6rem; scroll-margin-top: 4.5rem; }
.unit summary { display: flex; align-items: center; gap: .9rem; padding: .8rem .9rem; cursor: pointer; list-style: none; }
.unit summary::-webkit-details-marker { display: none; }
.unit[open] summary { border-bottom: 1px solid var(--line); }
.unit-no { flex: 0 0 auto; display: grid; place-items: center; width: 2.7rem; height: 2.7rem; border: 2px solid var(--ink); font: 700 1.5rem/1 var(--font-head); }
.unit-head { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.unit-title { font: 600 1.4rem/1.15 var(--font-head); }
.unit-count { color: var(--muted); font-size: .9rem; }
.chev { flex: 0 0 auto; width: .6rem; height: .6rem; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 .35rem .25rem 0; }
.unit[open] .chev { transform: rotate(-135deg); margin: .25rem .35rem 0 0; }
.unit-body { padding: .9rem .9rem 1rem; }
.unit-topics { margin: 0 0 .5rem; color: var(--muted); font-size: .95rem; max-width: 44rem; }
.grp { font: 700 1.15rem/1.2 var(--font-head); margin: 1.1rem 0 .35rem; }

.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 3.4rem 1fr auto; gap: .75rem; align-items: center; padding: .6rem 0; border-bottom: 1px solid var(--line); }
.row-standalone { background: var(--surface); padding-left: .8rem; padding-right: .8rem; }
.rows-boxed { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.rows-boxed .row { padding-left: .8rem; padding-right: .8rem; }
.rows-boxed .row:last-child { border-bottom: 0; }
.fmt { font: 700 .72rem/1 var(--font-body); text-align: center; padding: .32rem 0; border: 1px solid currentColor; border-radius: 3px; letter-spacing: .03em; }
.fmt-PPTX { color: var(--pptx); } .fmt-PDF { color: var(--pdf); } .fmt-FORM { color: var(--form); } .fmt-DOCX { color: var(--docx); }
.row-title { font-weight: 600; color: var(--ink); text-decoration: none; display: inline-block; padding: .15rem 0; }
.row-title:hover { color: var(--accent); text-decoration: underline; }
.row-meta { display: flex; flex-wrap: wrap; gap: .05rem .9rem; color: var(--muted); font-size: .875rem; }
.row-dl { display: inline-flex; align-items: center; min-height: 2.5rem; padding: .3rem .75rem; border: 1px solid var(--line); border-radius: var(--radius); font: 600 .95rem var(--font-body); text-decoration: none; color: var(--accent); white-space: nowrap; }
.row-dl:hover { border-color: var(--accent); background: var(--accent-soft); }
.badge-new { display: inline-block; vertical-align: middle; margin-left: .35rem; background: var(--amber); color: var(--on-amber); font: 700 .72rem/1 var(--font-body); padding: .25rem .4rem; border-radius: 3px; }
.unit summary .badge-new { margin-left: 0; }

/* ---- Assignments ---- */
.assign { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: .9rem 1rem 1rem; margin-bottom: .7rem; }
.assign.is-done { border-left-color: var(--ok); }
.assign-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .3rem .8rem; }
.assign h3 { margin: 0; font: 700 1.45rem/1.15 var(--font-head); }
.assign-sub { margin: .1rem 0 0; font-weight: 600; }
.assign-meta { margin: .15rem 0 .85rem; color: var(--muted); font-size: .95rem; }
.due { font-weight: 700; font-size: .95rem; }
.due-open { color: var(--accent); }
.due-soon { background: var(--amber); color: var(--on-amber); padding: .1rem .5rem; border-radius: 3px; }
.due-late { color: var(--danger); }
.due-none { color: var(--muted); font-weight: 400; }
.due-ok { color: var(--ok); }
.assign-actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.btn { display: inline-flex; align-items: center; min-height: 2.5rem; padding: .35rem .95rem; border: 1px solid var(--line); border-radius: var(--radius); font: 600 .95rem var(--font-body); text-decoration: none; color: var(--accent); background: var(--surface); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.check { display: inline-flex; gap: .5rem; align-items: center; margin-left: auto; min-height: 2.5rem; cursor: pointer; }
.check input { width: 1.2rem; height: 1.2rem; accent-color: var(--ok); }

/* ---- Course info ---- */
.info section { margin-bottom: 2rem; }
.marks { border-collapse: collapse; width: 100%; max-width: 26rem; background: var(--surface); border: 1px solid var(--line); margin-bottom: .6rem; }
.marks th, .marks td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line); font-weight: 400; }
.marks td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.marks tfoot th, .marks tfoot td { font-weight: 700; border-bottom: 0; }
.biblio { margin: 0; padding-left: 1.2rem; }
.biblio li { margin-bottom: .4rem; max-width: 44rem; }

.empty { padding: 1.4rem 1rem; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); background: var(--surface); }
.result-count { color: var(--muted); margin: 0 0 .7rem; }
footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
</style>
</head>

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

const today = new Date(); today.setHours(0, 0, 0, 0);
const parseDay = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const daysFromToday = s => Math.round((parseDay(s) - today) / 864e5);
const fmtDay = s => {
  const d = parseDay(s), o = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== today.getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-GB', o);
};
const isNew = it => { if (!it.added) return false; const ago = -daysFromToday(it.added); return ago >= 0 && ago <= NEW_DAYS; };

const unitOf = n => UNITS.find(u => u.n === n);
const TYPE_LABEL = { slides: 'Lecture slides', notes: 'Student notes', assignment: 'Assignment', quiz: 'Quiz', syllabus: 'Syllabus' };
const TYPE_ORDER = { syllabus: 0, slides: 1, notes: 2, assignment: 3, quiz: 4 };

function parseId(s) {
  s = String(s || '');
  let m = s.match(/\/d\/([\w-]+)/) || s.match(/[?&]id=([\w-]+)/);
  return m ? m[1] : s.trim();
}
const viewUrl = it => it.url || ('https://drive.google.com/file/d/' + parseId(it.file) + '/view');
const dlUrl = it => 'https://drive.google.com/uc?export=download&id=' + parseId(it.file);
const fmtOf = it => it.fmt || ({ slides: 'PPTX', notes: 'PDF', assignment: 'PDF', quiz: 'FORM' }[it.type] || 'FILE');
const sizeText = kb => kb >= 1000 ? (kb / 1000).toFixed(1) + ' MB' : kb + ' KB';

function displayTitle(it) {
  if (it.type === 'slides' && it.no != null && it.no > 0) return 'Lecture ' + it.no + ': ' + it.title;
  return it.title;
}
function contextLabel(it, ctx) {
  const u = it.unit ? 'Unit ' + unitOf(it.unit).roman : '';
  if (ctx === 'search') return [u, TYPE_LABEL[it.type].toLowerCase()].filter(Boolean).join(', ');
  return u;
}

/* ---------- state ---------- */
function loadDone() {
  try { return new Set(JSON.parse(store.get('bme-d-done') || '[]')); } catch (e) { return new Set(); }
}
const state = { tab: 'study', filter: 'all', q: '', open: new Set(), done: loadDone() };

function latestUnit() {
  let best = null;
  FILES.forEach(f => {
    if (!f.unit || (f.type !== 'slides' && f.type !== 'notes')) return;
    if (!best || f.added > best.added || (f.added === best.added && f.unit > best.unit)) best = f;
  });
  return best ? best.unit : 1;
}

/* ---------- one file row ---------- */
function rowHTML(it, ctx) {
  const f = fmtOf(it), title = displayTitle(it), open = viewUrl(it);
  const meta = [];
  if (ctx === 'search' || ctx === 'flat') { const c = contextLabel(it, ctx); if (c) meta.push(esc(c)); }
  if (it.kb) meta.push(sizeText(it.kb));
  if (it.added) meta.push('Added ' + fmtDay(it.added));
  const action = it.type === 'quiz'
    ? '<a class="btn btn-primary" href="' + esc(open) + '" target="_blank" rel="noopener noreferrer">Start quiz</a>'
    : '<a class="row-dl" href="' + esc(dlUrl(it)) + '" rel="noopener noreferrer" aria-label="Download ' + esc(title) + '">Download</a>';
  return '<li class="row">' +
    '<span class="fmt fmt-' + f + '">' + f + '</span>' +
    '<div><a class="row-title" href="' + esc(open) + '" target="_blank" rel="noopener noreferrer">' + esc(title) + '</a>' +
    (isNew(it) ? '<span class="badge-new">New</span>' : '') +
    '<div class="row-meta">' + meta.map(m => '<span>' + m + '</span>').join('') + '</div></div>' +
    action + '</li>';
}

/* ---------- Study material tab ---------- */
function recentGroups() {
  const map = new Map();
  FILES.forEach(f => {
    if (!f.unit || (f.type !== 'slides' && f.type !== 'notes')) return;
    const k = f.added + '|' + f.unit;
    if (!map.has(k)) map.set(k, { added: f.added, unit: f.unit, slides: 0, notes: 0 });
    map.get(k)[f.type]++;
  });
  return Array.from(map.values())
    .sort((a, b) => b.added.localeCompare(a.added) || b.unit - a.unit)
    .slice(0, 4);
}
function groupText(g) {
  const p = [];
  if (g.slides) p.push(g.slides + (g.slides === 1 ? ' slide deck' : ' slide decks'));
  if (g.notes) p.push(g.notes + (g.notes === 1 ? ' notes file' : ' notes files'));
  return p.join(' and ');
}

function renderStudy() {
  let h = '';
  const groups = recentGroups();
  if (groups.length) {
    h += '<section class="recent"><h2>Recently added</h2><ul>' + groups.map(g =>
      '<li><button type="button" class="recent-item" data-goto="' + g.unit + '">' +
      '<span class="recent-when">' + fmtDay(g.added) + '</span>' +
      '<span><strong>Unit ' + unitOf(g.unit).roman + '</strong>: ' + groupText(g) + '</span>' +
      '<span class="recent-go">Open</span></button></li>'
    ).join('') + '</ul></section>';
  }

  const allOpen = UNITS.every(u => state.open.has(u.n));
  h += '<div class="toolbar">' +
    '<div class="seg" role="group" aria-label="Show">' +
    [['all', 'All'], ['slides', 'Slides'], ['notes', 'Notes']].map(x =>
      '<button type="button" data-filter="' + x[0] + '" aria-pressed="' + (state.filter === x[0]) + '">' + x[1] + '</button>').join('') +
    '</div>' +
    '<button type="button" class="plain-btn" data-toggle-all>' + (allOpen ? 'Collapse all units' : 'Expand all units') + '</button>' +
    '</div>';

  h += UNITS.map(u => {
    const mine = FILES.filter(f => f.unit === u.n && (f.type === 'slides' || f.type === 'notes'));
    const slides = mine.filter(f => f.type === 'slides').sort((a, b) => (a.no == null ? 999 : a.no) - (b.no == null ? 999 : b.no));
    const notes = mine.filter(f => f.type === 'notes');
    const anyNew = mine.some(isNew);
    const counts = mine.length ? slides.length + ' slides, ' + notes.length + ' notes' : 'Nothing uploaded yet';

    let body = '<p class="unit-topics">' + esc(u.topics) + ' (' + u.hours + ' lecture hours)</p>';
    if (!mine.length) {
      body += '<p class="empty">Nothing has been uploaded for this unit yet.</p>';
    } else {
      if (state.filter !== 'notes') body += slides.length ? '<h3 class="grp">Lecture slides</h3><ul class="rows">' + slides.map(f => rowHTML(f, 'unit')).join('') + '</ul>' : '';
      if (state.filter !== 'slides') body += notes.length ? '<h3 class="grp">Student notes</h3><ul class="rows">' + notes.map(f => rowHTML(f, 'unit')).join('') + '</ul>' : '';
    }

    return '<details class="unit" id="unit-' + u.n + '" data-unit="' + u.n + '"' + (state.open.has(u.n) ? ' open' : '') + '>' +
      '<summary><span class="unit-no"><span class="sr">Unit </span>' + u.roman + '</span>' +
      '<span class="unit-head"><span class="unit-title">' + esc(u.title) + '</span><span class="unit-count">' + counts + '</span></span>' +
      (anyNew ? '<span class="badge-new">New</span>' : '') +
      '<span class="chev" aria-hidden="true"></span></summary>' +
      '<div class="unit-body">' + body + '</div></details>';
  }).join('');
  return h;
}

/* ---------- Assignments tab ---------- */
function dueInfo(a, done) {
  if (done) return { cls: 'ok', text: 'Done' };
  if (!a.due) return { cls: 'none', text: 'Submission date not announced yet' };
  const n = daysFromToday(a.due), when = fmtDay(a.due);
  if (n < 0) return { cls: 'late', text: 'Overdue, was due ' + when };
  if (n === 0) return { cls: 'soon', text: 'Due today' };
  if (n === 1) return { cls: 'soon', text: 'Due tomorrow' };
  if (n <= 3) return { cls: 'soon', text: 'Due ' + when + ', in ' + n + ' days' };
  return { cls: 'open', text: 'Due ' + when + ', in ' + n + ' days' };
}
function assignmentAsFile(a) {
  return { type: 'assignment', unit: a.unit, no: a.no, title: 'Assignment ' + a.no + ': ' + a.title, file: a.file, kb: a.kb, added: a.added, fmt: 'PDF' };
}
function publishedAssignments() {

}
function renderAssign() {

    return '<article class="assign' + (done ? ' is-done' : '') + '">' +

/* ---------- Search ---------- */
function searchPool() {
  return FILES.concat(publishedAssignments().map(assignmentAsFile));
}
function matches(it, tokens) {
  const u = it.unit ? unitOf(it.unit) : null;
  const hay = (displayTitle(it) + ' ' + TYPE_LABEL[it.type] + ' ' + fmtOf(it) + ' ' + (u ? 'unit ' + u.n + ' unit ' + u.roman + ' ' + u.title : '')).toLowerCase();
  return tokens.every(t => /^\d+$/.test(t) ? new RegExp('(^|\\D)' + t + '(\\D|$)').test(hay) : hay.indexOf(t) !== -1);
}
function renderSearch() {
  const q = state.q.trim(), tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  const res = searchPool().filter(it => matches(it, tokens)).sort((a, b) =>
    (a.unit || 0) - (b.unit || 0) || TYPE_ORDER[a.type] - TYPE_ORDER[b.type] || (a.no == null ? 999 : a.no) - (b.no == null ? 999 : b.no));
  if (!res.length) {
    return '<p class="empty">Nothing matches "' + esc(q) + '". Try a topic word such as pump, belt or casting, or a lecture number.</p>';
  }
  return '<p class="result-count">' + res.length + (res.length === 1 ? ' file matches "' : ' files match "') + esc(q) + '"</p>' +
    '<ul class="rows rows-boxed">' + res.map(it => rowHTML(it, 'search')).join('') + '</ul>';
}

/* ---------- render everything ---------- */
const PANELS = { study: renderStudy, assign: renderAssign, quiz: renderQuiz, info: renderInfo };

function updateCounts() {
  const n = publishedAssignments().filter(a => !state.done.has(a.no)).length;
  const c = $('#tab-assign .count');
  c.hidden = n === 0;
  c.innerHTML = n + '<span class="sr"> not done</span>';
}
function render() {
  const searching = state.q.trim() !== '';
  document.querySelectorAll('.tab').forEach(t => {
    t.setAttribute('aria-selected', String(!searching && t.dataset.tab === state.tab));
    t.tabIndex = t.dataset.tab === state.tab ? 0 : -1;
  });
  Object.keys(PANELS).forEach(k => {
    const p = $('#panel-' + k);
    p.hidden = searching || k !== state.tab;
    if (!p.hidden) p.innerHTML = PANELS[k]();
  });
  const sp = $('#panel-search');
  sp.hidden = !searching;
  if (searching) sp.innerHTML = renderSearch();
  updateCounts();
}

/* ---------- interactions ---------- */
const HASH = { study: 'study', assign: 'assignments', quiz: 'quizzes', info: 'info' };
function setTab(t) {
  state.tab = t; state.q = ''; $('#q').value = '';
  try { history.replaceState(null, '', '#' + HASH[t]); } catch (e) {}
  render();
}

document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-tab],[data-filter],[data-goto],[data-toggle-all]');
  if (!t) return;
  if (t.dataset.tab) { setTab(t.dataset.tab); return; }
  if (t.dataset.filter) { state.filter = t.dataset.filter; render(); return; }
  if (t.hasAttribute('data-toggle-all')) {
    const allOpen = UNITS.every(u => state.open.has(u.n));
    UNITS.forEach(u => allOpen ? state.open.delete(u.n) : state.open.add(u.n));
    render(); return;
  }
  if (t.dataset.goto) {
    const n = +t.dataset.goto;
    state.open.add(n); state.filter = 'all';
    render();
    const el = document.getElementById('unit-' + n);
    if (el) el.scrollIntoView({ block: 'start' });
  }
});

document.addEventListener('change', function (e) {
  if (!e.target.matches('[data-done]')) return;
  const n = +e.target.dataset.done;
  e.target.checked ? state.done.add(n) : state.done.delete(n);
  store.set('bme-d-done', JSON.stringify(Array.from(state.done)));
  render();
});

/* keep open/closed state of unit sections (toggle does not bubble, so use capture) */
document.addEventListener('toggle', function (e) {
  const d = e.target;
  if (!d.matches || !d.matches('details.unit')) return;
  const n = +d.dataset.unit;
  d.open ? state.open.add(n) : state.open.delete(n);
}, true);

$('#q').addEventListener('input', function (e) { state.q = e.target.value; render(); });

document.addEventListener('keydown', function (e) {
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    e.preventDefault(); $('#q').focus();
  }
  if (e.key === 'Escape' && document.activeElement === $('#q') && state.q) { state.q = ''; $('#q').value = ''; render(); }
});

$('.tabs').addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const tabs = Array.from(document.querySelectorAll('.tab')), i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
  next.focus(); next.click();
});

/* theme */
const themeBtn = $('#themeBtn');
const isDark = () => (document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function syncThemeBtn() { themeBtn.textContent = isDark() ? 'Light mode' : 'Dark mode'; }
themeBtn.addEventListener('click', function () {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.set('bme-d-theme', next);
  syncThemeBtn();
});

/* ---------- start ---------- */
(function init() {
  const h = (location.hash || '').replace('#', '');
  const found = Object.keys(HASH).find(k => HASH[k] === h);
  if (found) state.tab = found;
  state.open.add(latestUnit());
  syncThemeBtn();
  renderNotices();
  renderFoot();
  render();
})();

})();
</script>
</body>
</html>
